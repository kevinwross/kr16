name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.config }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            configure_preset: windows-ninja
            build_preset: windows-ninja-debug
            test_preset: windows-ninja-debug
          - config: Release
            configure_preset: windows-ninja-release
            build_preset: windows-ninja-release
            test_preset: windows-ninja-release
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}
      - name: Test
        run: ctest --preset ${{ matrix.test_preset }}
      - name: Resource manifest check
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/bootstrap-check.ps1

  linux:
    name: Linux ${{ matrix.compiler }} Debug
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev
      - name: Configure
        run: cmake --preset linux-${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.compiler }}-debug
      - name: Test
        run: ctest --preset linux-${{ matrix.compiler }}-debug

  linux-arm64:
    name: Linux ARM64 GCC Debug
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev
      - name: Configure
        run: |
          cmake -S . -B build/linux-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKR16_BUILD_UI=ON \
            -DKR16_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/linux-arm64 -j 4
      - name: Test
        run: ctest --test-dir build/linux-arm64 --output-on-failure

  linux-sanitize:
    name: Linux GCC ASan/UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev
      - name: Configure
        run: cmake --preset linux-gcc-sanitize
      - name: Build
        run: cmake --build --preset linux-gcc-sanitize
      - name: Test
        run: ctest --preset linux-gcc-sanitize
