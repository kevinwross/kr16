name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-ninja-release
      - name: Build
        run: cmake --build --preset windows-ninja-release
      - name: Test
        run: ctest --preset windows-ninja-release
      - name: Prepare signing certificate
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "kr16-signing.pfx"
          [IO.File]::WriteAllBytes(
            $path, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "KR16_SIGN_CERT=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:WINDOWS_PFX_PASSWORD) {
            "KR16_SIGN_PASSWORD=$env:WINDOWS_PFX_PASSWORD" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Package installer
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = (git log -1 --format=%ct)
          pwsh -NoProfile -File scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: KR16-windows-x64
          path: |
            build/windows-ninja-release/kr16.exe
            dist/kr16-1.0.0-windows-x64.zip

  linux-x64:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev
      - name: Build AppImage
        run: bash packaging/linux/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KR16-linux-x64
          path: dist/KR16-x86_64.AppImage

  linux-arm64:
    name: Linux ARM64 AppImage (Ubuntu 22.04)
    runs-on: ubuntu-24.04-arm
    container: arm64v8/ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and AppImage dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build curl ca-certificates git file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev
          curl -fL --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-aarch64.tar.gz \
            -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          ln -sf /opt/cmake-3.31.6-linux-aarch64/bin/cmake /usr/local/bin/cmake
          cmake --version
      - name: Build AppImage
        run: bash packaging/linux/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KR16-linux-arm64
          path: dist/KR16-aarch64.AppImage

  vscode:
    name: VS Code extension
    runs-on: ubuntu-22.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package VSIX
        working-directory: vscode
        run: mkdir -p ../dist && npx --yes @vscode/vsce package --no-dependencies -o ../dist/kr16-debug.vsix
      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode
        run: npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: KR16-vscode
          path: dist/kr16-debug.vsix

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux-x64, linux-arm64, vscode]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum kr16.exe kr16-1.0.0-windows-x64.zip \
            KR16-x86_64.AppImage KR16-aarch64.AppImage kr16-debug.vsix > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/kr16.exe \
            dist/kr16-1.0.0-windows-x64.zip \
            dist/KR16-x86_64.AppImage \
            dist/KR16-aarch64.AppImage \
            dist/kr16-debug.vsix \
            dist/SHA256SUMS \
            --generate-notes
